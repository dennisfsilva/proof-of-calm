# The private closes store's daily job (tools/data/daily.md; ADR-0058). This file is the template: the
# private repository dennisfsilva/proof-of-calm-closes runs a byte-for-byte copy of it as
# .github/workflows/closes-store.yml, and the job fails at the cmp step while the two differ. It checks out
# this repository's main only, with no ref input and no credential kept, runs the daily job into the
# store's checkout and commits what it added with the private repository's own GITHUB_TOKEN. The commit
# step runs after a failed pair too, so the other pairs' closes are kept. No cache, no artifact.
name: Closes store

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: closes-store
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: store
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dennisfsilva/proof-of-calm
          ref: main
          path: app
          persist-credentials: false
      - name: Fail while this copy differs from the reviewed template
        run: cmp store/.github/workflows/closes-store.yml app/tools/data/closes-store.yml
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.node-version
          package-manager-cache: false
      - name: Install the tools package
        working-directory: app
        run: pnpm install --frozen-lockfile --filter @proofofcalm/tools...
      - name: Append the closes
        working-directory: app
        run: node --import ./tools/data/hooks.ts tools/data/daily.ts --store ../store
      - name: Commit the closes
        if: ${{ !cancelled() }}
        working-directory: store
        run: |
          if [ ! -d closes ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- closes
          if git diff --cached --quiet; then exit 0; fi
          git commit --quiet --message "data: closes of $(date -u +%F)"
          git push --quiet
