# The private closes store's daily job (tools/data/daily.md; ADR-0058). This file is the template: the
# private repository dennisfsilva/proof-of-calm-closes runs a byte-for-byte copy of it as
# .github/workflows/closes-store.yml, and the job fails at the cmp step while the two differ. It checks out
# this repository's main only, with no ref input and no credential kept, runs the daily job into the
# store's checkout and commits what it added with the private repository's own GITHUB_TOKEN. The commit
# step runs after a failed pair too, so the other pairs' closes are kept, and after the daily step's own
# timeout, which fails that step without cancelling the job; it stages only the store's finished .csv
# files, never a temporary file a killed write left, in one commit per exchange, Bitstamp's first and
# Kraken's last; an exchange with no such file, tracked or new (a fresh store, or a first run whose pairs
# all failed), is skipped and does not stop the other's commit. A push rejected because the store moved on after the checkout (a backfill or a workflow
# copy pushed meanwhile) is retried up to 3 times, each 10 s later on
# top of a pull with rebase. A rebase that conflicts only on Kraken files skips Kraken's commit (the next
# run's 720-day window reads that day again) and goes on, so Bitstamp's day, which cannot be read again,
# is pushed, and the step fails at the end; a conflict on any other file aborts the rebase and fails the
# step. No cache, no artifact.
name: Closes store

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: closes-store
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: store
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dennisfsilva/proof-of-calm
          ref: main
          path: app
          persist-credentials: false
      - name: Fail while this copy differs from the reviewed template
        run: cmp store/.github/workflows/closes-store.yml app/tools/data/closes-store.yml
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.node-version
          package-manager-cache: false
      - name: Install the tools package
        working-directory: app
        run: pnpm install --frozen-lockfile --filter @proofofcalm/tools...
      - name: Append the closes
        working-directory: app
        timeout-minutes: 8
        run: node --import ./tools/data/hooks.ts tools/data/daily.ts --store ../store
      - name: Commit the closes
        if: ${{ !cancelled() }}
        working-directory: store
        run: |
          if ! ls closes/*/*.csv > /dev/null 2>&1; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          day=$(date -u +%F)
          made=
          dropped=
          for exchange in bitstamp kraken; do
            files=$(git ls-files --cached --others --exclude-standard -- ":(glob)closes/$exchange/*.csv")
            if [ -z "$files" ]; then continue; fi
            git add --all -- ":(glob)closes/$exchange/*.csv"
            if git diff --cached --quiet; then continue; fi
            git commit --quiet --message "data: $exchange closes of $day"
            made=1
          done
          if [ -z "$made" ]; then exit 0; fi
          for try in 1 2 3 4; do
            if git push --quiet; then exit "${dropped:-0}"; fi
            if [ "$try" = 4 ]; then exit 1; fi
            sleep 10
            if git pull --rebase --quiet; then continue; fi
            unmerged=$(git diff --name-only --diff-filter=U)
            others=$(git diff --name-only --diff-filter=U -- ':(exclude)closes/kraken/')
            if [ -z "$unmerged" ] || [ -n "$others" ]; then git rebase --abort || true; exit 1; fi
            if ! git rebase --skip; then git rebase --abort || true; exit 1; fi
            dropped=1
          done
