packages:
  - apps/*
  - packages/*
  - tools

# Settings (pnpm 12 reads them here, not from .npmrc)
saveExact: true
engineStrict: true
catalogMode: strict
# On since 2026-10-26: every catalog entry is in use, and a package adds its pin with its first use
# (ADR-0005, deviation of 2026-10-26). `pnpm install` deletes an entry no package uses.
catalogPrune: true
minimumReleaseAge: 4320            # three days; see ADR-0025
minimumReleaseAgeExclude:
  - "@proofofcalm/*"
  # The time-boxed exemption of ADR-0025 (deviation of 2026-10-17) left on 2026-10-20, as dated.
trustPolicy: no-downgrade
trustPolicyExclude:                # exact versions only, each reviewed (ADR-0025 deviation of 2026-10-17)
  - semver@6.3.1                   # 2023 release, required by @babel/core 7; later semver releases carry provenance, this one predates it
  - semver@5.7.2                   # 2023 release, the fixed 5.x line (override below); predates provenance like 6.3.1
blockExoticSubdeps: true
# Fixed releases of transitive development dependencies with known advisories (osv-scanner.toml has
# the ones without a fix). Each stays in its major, so the API is the same.
overrides:
  semver@5.7.1: 5.7.2              # GHSA-c2qf-rxjj-qqgw
  "tmp@<0.2.6": 0.2.7              # GHSA-52f5-9888-hmc6, GHSA-ph9p-34f9-6g65
  body-parser@1.20.8: 1.20.9       # GHSA-27r3-jxmh-p828
  body-parser@2.3.0: 2.4.0         # GHSA-27r3-jxmh-p828
  fast-uri@3.1.8: 3.1.9            # GHSA-333x-w4r6-6crp, GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h
  undici@7.30.0: 7.30.1            # GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472, GHSA-xjj6-f33q-929c
  undici@8.12.1: 8.12.2            # GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472, GHSA-xjj6-f33q-929c
  systeminformation@5.33.15: 5.33.16 # GHSA-3f7j-7jwc-fxfj
  "@serwist/build>zod@4.6.5": 4.6.7 # GHSA-mrhx-c7xc-m3w5; the catalog's version (a bare zod key also rewrites zod peer ranges)
  hono@4.13.13: 4.13.16            # GHSA-3gg2-335m-rxc6, GHSA-46wx-v44x-9hh2, GHSA-4h7h-rv7c-7m2v, GHSA-4m76-xfj5-7975, GHSA-h7mg-cq63-vhpq
  "@hono/node-server@2.1.5": 2.1.6 # GHSA-jpvv-r467-5p4w, GHSA-qv5m-9pm6-hqp3
strictDepBuilds: true
allowBuilds:                       # a map since pnpm 11 (https://pnpm.io/settings/build)
  esbuild: true
  sharp: true
  "@biomejs/biome": true
  "@tailwindcss/oxide": true
  # Reviewed and disallowed (2026-10-17): @swc/core (came with @serwist/turbopack) and @parcel/watcher
  # (with next-intl's message extractor). Both ship prebuilt platform binaries as optional dependencies;
  # their scripts only build from source. Neither is in the lockfile since ADR-0045 (steps 1 and 6);
  # the entries stay so a dependency that brings one back cannot build from source unreviewed.
  "@swc/core": false
  "@parcel/watcher": false

# Single-version policy. Every workspace package references these as "catalog:".
# Versions were researched on 2026-10-16 (docs/ADR/0005 and docs/research/stack-*.md).
# The build session installs exactly these; a deviation gets a line in the relevant ADR.
catalog:
  # framework and UI (Next left on 2026-10-20, ADR-0045 step 6)
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0          # 19.3.1 does not exist on npm; nearest release (ADR-0005 deviation)
  "@types/react-dom": 19.3.0      # same
  babel-plugin-react-compiler: 1.0.0
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@base-ui/react": 1.9.0
  tw-animate-css: 1.4.0
  lucide-react: 1.58.0
  class-variance-authority: 0.7.1
  tailwind-merge: 3.7.0
  clsx: 2.1.1
  use-intl: 4.14.9                # next-intl's core without Next (ADR-0045 §8); published 2026-10-02 (added 2026-10-17)
  icu-minify: 4.14.9               # compiles the message files at build time so the ICU parser leaves the bundle (ADR-0045 §8); its format is part of use-intl's 3,800 bytes brotli; published 2026-10-02 (added 2026-10-19)
  wouter: 3.13.0                   # the router, only in packages/app/src/lib/navigation (ADR-0045 §9); 2,512 bytes brotli over React alone; published 2026-09-30 (added 2026-10-19)
  zustand: 5.0.15
  idb: 8.0.4
  zod: 4.6.7
  big.js: 7.0.1
  "@types/big.js": 6.2.2
  serwist: 9.5.13
  "@serwist/build": 9.5.13        # injectManifest for the worker built by esbuild (ADR-0045 §5); build time only (added 2026-10-19)
  esbuild: 0.28.2
  "@upstash/redis": 1.39.0
  server-only: 0.0.1                # the build-time guard on modules that read secrets (docs/SECURITY.md §8); empty on the server, never in a client bundle (added 2026-10-17)
  # tooling
  typescript: 6.0.3
  turbo: 2.11.8
  "@biomejs/biome": 2.5.15
  eslint: 10.13.0
  eslint-plugin-react-hooks: 7.1.1
  "@typescript-eslint/parser": 8.71.2  # ESLint cannot parse TypeScript without it; parser only, no type-aware rules (ADR-0025 deviation)
  dependency-cruiser: 18.6.0
  knip: 6.41.0
  shadcn: 4.22.0
  "@types/node": 24.19.2          # Node 24 types for tools, configs and tests (added 2026-10-17)
  # tests
  vitest: 5.0.5
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  vite: 8.3.4
  "@vitejs/plugin-react": 6.1.2   # React in Vite 8, for Storybook now and the hosts from ADR-0045 step 5 (added 2026-10-17)
  "@rolldown/plugin-babel": 0.2.4 # runs babel-plugin-react-compiler under Vite 8 (ADR-0045 §12; added 2026-10-17)
  "@babel/core": 7.29.7           # for the compiler plugin; 8.0.7 exists, 7.29 is what ADR-0045's spike proved
  "@mdx-js/rollup": 3.1.1         # compiles the Learn modules at build time in the hosts' Vite factory (ADR-0048); dev-time only, a compiled module imports only react/jsx-runtime; published 2025-08-29 (added 2026-11-01)
  fast-check: 4.10.2
  "@testing-library/react": 16.3.3
  "@testing-library/dom": 10.4.2  # required peer of @testing-library/react 16 (added 2026-10-17)
  "@testing-library/user-event": 14.6.8
  jsdom: 30.1.3
  "@types/jsdom": 30.0.0           # types for the golden-fixture tool in tools/golden; dev only (added 2026-10-17)
  fake-indexeddb: 6.2.2
  "@playwright/test": 1.64.1
  playwright: 1.64.1              # the browser provider's peer for Storybook's Vitest tests; same release as @playwright/test (added 2026-10-17)
  "@axe-core/playwright": 4.14.0
  storybook: 10.6.2
  "@storybook/react-vite": 10.6.2  # replaces @storybook/nextjs-vite, which left with its last user (ADR-0045 step 2)
  "@storybook/addon-vitest": 10.6.2
  "@storybook/addon-a11y": 10.6.2
  "@lhci/cli": 0.15.1
  date-fns: 4.4.0                 # dev-only oracle for date property tests (ADR-0018)
