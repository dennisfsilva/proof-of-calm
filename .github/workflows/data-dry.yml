# The daily job's dry run (tools/data/daily.md; ADR-0058, Decision 4): a branch's evidence for a change to
# tools/data. It reads every pair from the exchanges' public endpoints into a store under the runner's
# temporary folder with --dry, so nothing is written, and prints only the job's closed set of lines:
# names, statuses and whole-number counts, never a close. No secret, no cache, no artifact. A workflow
# that is not on main cannot be dispatched, so a branch proves itself by its push run.
name: Data dry run

on:
  push:
    branches-ignore:
      - main
    paths:
      - "tools/data/**"
      - ".github/workflows/data-dry.yml"
  workflow_dispatch:

permissions: {}

jobs:
  dry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter @proofofcalm/tools...
      - name: Read every pair into a temporary store, writing nothing
        run: |
          mkdir "$RUNNER_TEMP/store"
          node --import ./tools/data/hooks.ts tools/data/daily.ts --store "$RUNNER_TEMP/store" --dry
