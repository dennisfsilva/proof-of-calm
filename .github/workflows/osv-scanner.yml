# Known-vulnerability scan of the lockfile (docs/SECURITY.md §9). SARIF upload to code scanning needs
# GitHub Advanced Security on a private repository, so the results stay in the job log and an
# artifact, and the job fails on any finding. The reusable workflows run on ubuntu-latest unless their
# `runs-on` input says otherwise; like every other job here, the scan runs on ubuntu-24.04. A change to
# this file runs the scan on its own pull request, which proves it.
name: OSV-Scanner

on:
  pull_request:
    paths: [pnpm-lock.yaml, '**/package.json', pnpm-workspace.yaml, osv-scanner.toml, .github/workflows/osv-scanner.yml]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      runs-on: ubuntu-24.04
      upload-sarif: false
      fail-on-vuln: true

  scan:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      runs-on: ubuntu-24.04
      upload-sarif: false
      fail-on-vuln: true
