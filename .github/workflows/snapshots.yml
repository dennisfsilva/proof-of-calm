# Visual baselines (ADR-0024): rendered only in the pinned Playwright container, where CI compares
# them. Dispatch it on a branch, download the artifact into apps/web/e2e, review every image, and commit
# them in a pull request that waits for the owner's review.
name: Snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    name: snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web host
        run: pnpm --filter @proofofcalm/web build
      - name: Render every baseline on the viewport matrix
        run: pnpm --filter @proofofcalm/web exec playwright test --grep "reviewed baseline" --update-snapshots=all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: apps/web/e2e/**/*-snapshots/**
          retention-days: 7
