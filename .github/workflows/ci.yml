# The gate, on every pull request and on main (ADR-0024, ADR-0025); this header owns its composition.
# verify: Biome, ESLint, the dependency, styling, docs and size lints, knip, types, the unit, property
# and component tests with 100 % coverage on packages/core, content validation, security.txt, the
# commit subjects, the PR's label and body lines, and the content review guard (an agent/ or content-review
# PR changes and deletes only content data, judged by the base commit's copy of the script before pnpm or any
# PR code runs, in a step the PR's copy of this file holds, so a PR that edits ci.yml can change it: a
# tripwire; the owner's diff read sees any .github/ change, and the review's finish
# (`node tools/content-review/propose.ts finish`) refuses one before any push; every other PR gets the
# listing as a report). stories: every story at
# two widths in both themes with axe. export-build: the Vite export of apps/mobile, its export check and its smoke test in the
# pinned container. e2e-visual: in the pinned container, e2e-build makes the web build once, with the
# bundle secret scan and Today's application code (`node tools/size/today.ts`; weaker since Today's
# code-splitting group put vendor and app code in one chunk, its method and budget kept: the lighthouse
# job's script budget replaces the lost margin, docs/ENGINEERING.md §4), and three e2e-shard jobs
# run a third of the Playwright matrix each on it (Playwright's --shard=i/3, 45 min each; a shard is
# added once a green shard passes 35 min); the e2e-visual job, the required check, passes when the build
# and all three shards passed and is skipped when they are. lighthouse: the budgets against the local
# build, on push to main (on a branch before a merge, `gh workflow run lighthouse-branch.yml --ref <branch>` runs the same steps), never on
# a pull request (lighthouse-vercel.yml measures production at Vercel by itself, a preview by dispatch); the performance score, TBT and LCP of
# the seeded screens only warn there until main measures them within budget (docs/ENGINEERING.md §4).
# Today's script budget (resource-summary:script:size) is at error there, and a branch that changes
# what Today loads runs lighthouse-branch.yml before review (docs/BUILD-PROMPT.md).
# The main ruleset requires verify, stories, export-build and e2e-visual (docs/OWNER-SETUP.md §1).
# A change that touches only docs/,
# README.md or CLAUDE.md (the PR's files; on push, the diff from the previous head) runs verify and
# skips the jobs that build and render the app; a skipped job satisfies the ruleset, and if the file
# check itself fails, everything runs.
# On push, stories, export-build and e2e-visual are skipped when the merge landed exactly what its pull
# request passed (#194, ADR-0024, deviation of 2026-10-27): the merged pull request's head has main's
# new tree, contains the previous head of main, and its runs passed the three, none of them failed or
# still running. Any other push that changes the app, a failed lookup among them, runs the three.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.files.outputs.app }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      # On push the diff needs both commits; a pull request reads its files from the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'push' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          elif [ "$GITHUB_EVENT_NAME" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"; echo "no previous head to diff against: everything runs"; exit 0
          elif ! files=$(git diff --name-only "$BEFORE..HEAD"); then
            echo "app=true" >> "$GITHUB_OUTPUT"; echo "the diff $BEFORE..HEAD failed: everything runs"; exit 0
          fi
          others=$(printf '%s\n' "$files" | { grep -v -E '^(docs/|README\.md$|CLAUDE\.md$)' || true; } | grep -c . || true)
          if [ "$others" -gt 0 ]; then echo "app=true"; else echo "app=false"; fi >> "$GITHUB_OUTPUT"
          echo "$others changed file(s) outside docs/, README.md and CLAUDE.md"
      # Whether the merged pull request's runs decide stories, export-build and e2e-visual (the header):
      # they saw this main only if its head contains the previous head of main, and tested this code only
      # if its head has the same tree. Each check that cannot be made runs everything.
      - id: tested
        if: ${{ github.event_name == 'push' && steps.files.outputs.app == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          # passed <sha>: each of the three passed on <sha>, and no check of them there failed or is running.
          passed() {
            for job in stories export-build e2e-visual; do
              states=$(gh api "$repo/commits/$1/check-runs?check_name=$job&filter=all&per_page=100" \
                --jq '[.check_runs[] | select(.app.slug == "github-actions") | if .status == "completed" then .conclusion else .status end] | join(" ")') \
                || { echo "the checks of $1 could not be read"; return 1; }
              for state in $states; do
                case "$state" in success|skipped) ;; *) echo "$job is $state on $1"; return 1 ;; esac
              done
              if ! printf '%s\n' $states | grep -qx success; then echo "$job never passed on $1"; return 1; fi
            done
          }
          unread() { echo "$1 could not be read: everything runs"; exit 0; }
          pr=$(gh api "$repo/commits/$GITHUB_SHA/pulls" --jq 'map(select(.merged_at != null))[0] // empty | "\(.number) \(.head.sha)"') \
            || unread "the pull requests of $GITHUB_SHA"
          read -r number head <<< "$pr" || true
          if [ -z "$head" ]; then echo "no merged pull request found for $GITHUB_SHA: everything runs"; exit 0; fi
          head_tree=$(gh api "$repo/git/commits/$head" --jq '.tree.sha') || unread "the tree of #$number's head"
          if [ "$head_tree" != "$(git rev-parse "$GITHUB_SHA^{tree}")" ]; then echo "#$number's head $head has another tree: everything runs"; exit 0; fi
          status=$(gh api "$repo/compare/$BEFORE...$head" --jq '.status') || unread "the comparison of $BEFORE with #$number's head"
          if [ "$status" != ahead ]; then echo "#$number's head does not contain $BEFORE ($status): everything runs"; exit 0; fi
          if ! passed "$head"; then echo "everything runs"; exit 0; fi
          echo "tested=true" >> "$GITHUB_OUTPUT"
          echo "#$number's head $head has this tree and passed stories, export-build and e2e-visual on top of $BEFORE"

  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Node without pnpm's cache, so nothing reads the PR's pnpm configuration before the guard below.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The content review guard (docs/CONTENT-OPS.md §1, §3): an agent/ branch or a PR labelled content-review
      # may change only content data and delete none of it (a data file renamed away is a deletion). Every
      # other PR gets the same listing as a report and is never failed by it. An agent/ head is always
      # enforced; the label is read when the run starts, so a label added later counts from the next push
      # (the default pull_request types: a label change starts no run). The files API lists at most 3,000
      # files, so the count is compared. The script is the base commit's copy, run before pnpm or any PR code
      # (which could write GITHUB_ENV or GITHUB_PATH), so a PR that edits the script never judges itself; the
      # step is the PR's copy of this workflow, so a PR that edits ci.yml can change or drop it: a tripwire.
      # The owner's diff read (docs/CONTENT-OPS.md §8) sees any .github/ change, and the review's finish,
      # `node tools/content-review/propose.ts finish`, refuses one before any push. On a base without the
      # script (no agent branch can exist yet) the PR's own copy only reports, and the step passes.
      - name: Content data only on agent PRs
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          script=tools/content-review/check.ts guard="$RUNNER_TEMP/content-review/check.mts" report=
          if git cat-file -e "$BASE_SHA:$script" 2>/dev/null; then
            mkdir -p "${guard%/*}" && git cat-file blob "$BASE_SHA:$script" > "$guard"
          else
            echo "the base $BASE_SHA has no $script: the PR's own copy reports, not enforced"; guard=$script report=1
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '"\(.changed_files) \([.labels[].name] | any(. == "content-review"))"')
          read -r changed labelled <<< "$pr"
          enforce=(); if [ "$labelled" = true ]; then enforce=(--enforce); fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | [.filename, .previous_filename // "", .status] | @tsv' \
            | node "$guard" pr-files "$HEAD_REF" --expect "$changed" "${enforce[@]}" || [ -n "$report" ]
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, format and the dependency rule
        run: pnpm lint
      - name: Dead code
        run: pnpm lint:dead
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit, property and component tests (100 % coverage on packages/core)
        run: pnpm test
      - name: Content validation
        run: pnpm validate:content
      # Fails 30 days before Expires, so the file is renewed while still valid (docs/LEGAL.md §5).
      - name: security.txt fields and expiry (RFC 9116)
        run: node tools/security-txt/check.ts
      # Last, and even when an earlier step failed, so a message problem never hides the code checks.
      - name: Conventional commits
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: node tools/commits/check.ts "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      # The PR shape of the process (docs/BUILD-PROMPT.md): the checkpoint label, a Session line and a
      # Review line; read at run time so a label added after opening counts. The owner's and the bots'
      # PRs are exempt.
      - name: PR label and body lines
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.labels[].name')
          if printf '%s\n' "$labels" | grep -q -x -E 'needs-owner|bot'; then echo "labelled needs-owner or bot: not checked"; exit 0; fi
          author=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.user.login + " " + .user.type')
          case "$author" in *"[bot]"*|*" Bot") echo "opened by a bot ($author): not checked"; exit 0;; esac
          body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.body // ""')
          status=0
          printf '%s\n' "$labels" | grep -q -x 'checkpoint' || { echo "::error::the PR needs the label checkpoint"; status=1; }
          printf '%s\n' "$body" | grep -q -E '^Session: #[0-9]+' || { echo "::error::the PR body needs a 'Session: #<issue>' line"; status=1; }
          printf '%s\n' "$body" | grep -q -E '^Review: tier [012], [0-9]+ findings, [0-9]+ confirmed, [0-9]+ judgment' \
            || { echo "::error::the PR body needs a 'Review: tier <0|1|2>, <k> findings, <m> confirmed, <j> judgment' line"; status=1; }
          exit "$status"

  stories:
    name: stories
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # The pinned Playwright container (ADR-0024): Chromium and its libraries match the installed version.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The container runs as root over a workspace the runner's user owns, so git refuses it unless it
      # is marked safe, and checkout marks it only for its own commands: turbo then logged "failed to run
      # git diff for dirty hash" and hashed without git.
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every story at 360 and 1280 px, light and dark, with axe (docs/ENGINEERING.md §2)
        run: pnpm storybook:test

  export-build:
    name: export-build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # The pinned container (ADR-0024): the smoke test renders the export in its Chromium.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Static export of the wrapper host (ADR-0032, ADR-0045 §10)
        run: pnpm build:export
      - name: The export's shape (one entry, no worker, the API at the absolute origin)
        run: pnpm --filter @proofofcalm/mobile check:export
      - name: The export renders from plain files
        run: pnpm --filter @proofofcalm/mobile test:e2e

  # e2e-visual in three parts (the header): e2e-build builds once, e2e-shard runs a third of the matrix
  # on that build, and e2e-visual is the one required check over both.
  e2e-build:
    name: e2e-build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # The pinned container (ADR-0024): the shards render this build in the same image.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As in stories: the container's git trusts the workspace only once it is marked safe, so a turbo
      # or git call in this job hashes and reads the repository.
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web host
        run: pnpm --filter @proofofcalm/web build
      # Nothing a browser downloads holds a server-side value or a key-shaped string (docs/SECURITY.md §8).
      - name: Bundle secret scan
        run: node tools/scan/secrets.ts apps/web/dist
      # Today's application code within 45 kB brotli, from the build's chunk report (docs/ENGINEERING.md §4).
      - name: Today's application code
        run: node tools/size/today.ts
      # What tools/serve/vercel-local.ts serves: the client build and the function's bundle. dist holds
      # .well-known, which upload-artifact skips unless asked.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-build
          path: |
            apps/web/dist
            apps/web/server-dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e-shard:
    name: e2e-shard ${{ matrix.shard }}/3
    needs: e2e-build
    if: ${{ !cancelled() && needs.e2e-build.result == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Measured: the unsharded matrix took 41 min of its 45 on main at afdb7747 (run 40914329624). Each
    # shard keeps the 45-minute limit; add a shard once a green shard passes 35 min. The ruleset requires
    # only e2e-visual (docs/OWNER-SETUP.md §1), so the shard count changes here alone.
    timeout-minutes: 45
    permissions:
      contents: read
    # The pinned container (ADR-0024): visual baselines are only valid in this exact image.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-web-build
          path: apps/web
      - name: Playwright on the viewport matrix
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter @proofofcalm/web test:e2e --shard="$SHARD/3"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # The required check (docs/OWNER-SETUP.md §1). Skipped exactly when e2e-build is skipped for want of
  # an app change; otherwise it passes only when the build and every shard passed, so a failed, timed
  # out or cancelled part, or a shard skipped after a failed build, fails it.
  e2e-visual:
    name: e2e-visual
    needs: [changes, e2e-build, e2e-shard]
    if: ${{ always() && needs.changes.outputs.app != 'false' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The build and every shard passed
        env:
          BUILD: ${{ needs.e2e-build.result }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e-build: $BUILD; e2e-shard: $SHARDS"
          [ "$BUILD" = success ] && [ "$SHARDS" = success ]

  lighthouse:
    name: lighthouse
    needs: changes
    # On push; on a branch before the merge, lighthouse-branch.yml runs these steps by hand. Never on a
    # pull request, whose Vercel preview lighthouse-vercel.yml measures only by dispatch; lighthouse is
    # not a required check (docs/OWNER-SETUP.md §1).
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web host
        run: pnpm --filter @proofofcalm/web build
      # Against the production build behind the brotli proxy on every push and dispatch; lighthouse-vercel.yml
      # runs the same assertions, every one at error, against production's deployment and a dispatched preview (docs/ENGINEERING.md §4).
      - name: Lighthouse CI with the budgets
        # The seed's puppeteer-core finds no Chrome by itself (lighthouse-vercel.yml says why).
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: pnpm --filter @proofofcalm/web lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse
          path: apps/web/.lighthouseci
          # The reports live in a dot-folder, which upload-artifact skips unless asked.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
